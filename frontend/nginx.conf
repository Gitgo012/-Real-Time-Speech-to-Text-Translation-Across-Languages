upstream backend {
    server backend:5000;
}

# Ensure proper Connection header for WebSocket upgrades
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 360s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Proxy POST requests for /register and /login to backend (API form POSTs).
    # Serve GET requests from the SPA (index.html) so client routing works.
    location = /register {
        # Common proxy headers (kept outside the if to avoid invalid directives inside if)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;

        if ($request_method = POST) {
            proxy_pass http://backend;
        }

        try_files $uri $uri/ /index.html;
    }

    location = /login {
        # Common proxy headers (kept outside the if to avoid invalid directives inside if)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;

        if ($request_method = POST) {
            proxy_pass http://backend;
        }

        try_files $uri $uri/ /index.html;
    }

    # Proxy logout requests to the backend so the backend can clear server-side session
    location = /logout {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;
    }

    # Proxy only true API/backend endpoints. Let client-side routes (e.g. /login, /register)
    # fall through to the React SPA (index.html).
    location ~ ^/(api|flask_session|health|debug) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}




